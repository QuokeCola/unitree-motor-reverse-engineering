[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g1motor"
version = "0.4.0"
description = "Unofficial driver for Unitree G1 joint motors over their RS-485 bus (reverse engineered)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
g1motor = "g1motor.cli:main"

[tool.setuptools]
packages = ["g1motor"]

[tool.pytest.ini_options]
python_files = ["*_test.py"]
testpaths = ["tests"]
