[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-joint-motor-sdk"
version = "0.2.0"
description = "Unofficial driver for Unitree G1 joint motors over their RS-485 bus (reverse engineered)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
g1motor = "g1_joint_motor_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
